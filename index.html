<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Viva La Pizza – Menú 2</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --brand-red:    #c22b27;
    --brand-yellow: #efa52b;
    --white:        #f0ece4;
    --black:        #010101;
    --bg:           #efa52b;
  }
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'Montserrat', sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  body::before {
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(1,1,1,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(1,1,1,.04) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: gridScroll 20s linear infinite;
  }
  @keyframes gridScroll { to { background-position: 0 60px; } }
  #pizzaCanvas {
    position:fixed; inset:0; z-index:1; pointer-events:none;
  }



  /* ── MAIN SCROLL AREA ── */
  main {
    position:relative; z-index:5;
    flex:1; overflow:hidden;
    padding: 6px 10px 8px;
    display: grid;
    grid-template-rows: 28fr 20fr 24fr 28fr;
    gap: 8px;
    height: 100%;
  }

  /* ── SECTION ROW ── */
  .section {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-height: 0;
    overflow: hidden;
  }

  /* ── CATEGORY TITLE BAR ── */
  .cat-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(1.2rem, 2.1vw, 1.92rem);
    letter-spacing: .242em;
    background: transparent;
    color: #ffffff;
    font-weight: 700;
    padding: 4px 0;
    border-radius: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    width: 100%;
    flex-shrink: 0;
    border: none;
  }
  .cat-inner {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(90deg, #010101 0%, #010101 60%, #3d0808 85%, #6b0f0d 100%);
    padding: 6px 36px;
    clip-path: polygon(0% 0%, 100% 0%, calc(100% - 16px) 50%, 100% 100%, 0% 100%, 16px 50%);
  }
  .cat-item-icon { font-size: 1.1em; }
  .cat-item-label {
    text-shadow: 0 0 8px #fff8, 0 0 20px var(--brand-red);
    font-weight: 700;
    animation: catPulse 3s ease-in-out infinite;
  }
  @keyframes catPulse {
    0%, 100% { opacity: 1; text-shadow: 0 0 6px #fff8, 0 0 16px var(--brand-red); }
    50%       { opacity: 0.78; text-shadow: 0 0 3px #fff4, 0 0 8px var(--brand-red); }
  }

  /* ── RED DIVIDER ── */
  .cat-title::before {
    content: '';
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    transform: translateY(-50%);
    height: 2px;
    background: linear-gradient(90deg, transparent 0%, var(--brand-red) 8%, var(--brand-red) 92%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }
  .cat-title {
    position: relative;
  }
  .cat-inner {
    position: relative;
    z-index: 1;
  }

  /* ── CARDS ROW ── */
  .cards-row {
    display: grid;
    gap: 2px;
    flex: 1;
    min-height: 0;
    align-content: stretch;
  }

  /* Entrantes: 5 per row, 2 rows — each row equal height */
  .row-entrantes { grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(2, 1fr); height: 100%; }
  /* Hot Dogs: 3 cards */
  .row-hotdogs   { grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr; height: 100%; }
  /* Sandwiches: 5 cards */
  .row-sandwiches { grid-template-columns: repeat(5, 1fr); grid-template-rows: 1fr; height: 100%; }
  /* Ensaladas: 6 cards */
  .row-ensaladas { grid-template-columns: repeat(6, 1fr); grid-template-rows: 1fr; height: 100%; }

  /* All cards fill their grid cell */
  .cards-row .card {
    height: 100%;
  }

  /* ── CARD (pizza style) ── */
  .card {
    position: relative;
    border: 1px solid #ffffff0d;
    border-radius: 7px;
    padding: 8px 0 0 10px;
    overflow: hidden;
    transition: transform .28s cubic-bezier(.34,1.56,.64,1), border-color .25s, box-shadow .25s;
    animation: fadeUp .5s ease both;
    display: flex;
    flex-direction: column;
    backdrop-filter: blur(2px);
    min-height: 0;
  }
  .card-g1 { background: linear-gradient(145deg, #0a0000, #3a0a0a); border-color: #5a0f0f; }
  .card-g4 { background: linear-gradient(145deg, #1a0f00, #2e1f00); border-color: #5a3d00; }

  .card:hover {
    transform: translateY(-3px) scale(1.012);
    border-color: var(--brand-red);
    box-shadow: 0 6px 22px #c22b2740, 0 2px 8px #00000060, inset 0 0 18px #c22b2710;
  }
  .card:hover .card-name { color:#fff; }

  /* left accent bar */
  .card::after {
    content:''; position:absolute; left:0; top:10%; bottom:10%; width:3px;
    background: linear-gradient(180deg, transparent, var(--brand-red), var(--brand-yellow), var(--brand-red), transparent);
    border-radius: 0 2px 2px 0;
    animation: edgePulse 3s ease-in-out infinite;
  }
  @keyframes edgePulse {
    0%,100% { opacity:.4; box-shadow:none; }
    50%      { opacity:1; box-shadow: 0 0 8px #c22b2799, 0 0 16px #c22b2744; }
  }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(8px); }
    to   { opacity:1; transform:translateY(0); }
  }

  /* card inner */
  .card-inner {
    display: flex; height:100%; position:relative; z-index:2; margin: 0 -10px 0 0;
  }
  .card-content {
    flex: 0 0 72%; max-width:72%;
    display:flex; flex-direction:column; gap:3px;
    min-width:0; position:relative; z-index:2;
  }
  .card-photo-wrap {
    position:absolute; right:0; top:0; bottom:0; width:42%; z-index:1;
    border-radius: 0 7px 7px 0;
  }
  .card-photo {
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; pointer-events:none;
    filter: saturate(1.1) brightness(0.88);
    mask-image: linear-gradient(to right, transparent 0%, black 5%);
    -webkit-mask-image: linear-gradient(to right, transparent 0%, black 5%);
  }

  /* card row: number · name · price */
  .card-row {
    display:flex; align-items:baseline; gap:3px; flex-wrap:nowrap; min-width:0;
  }
  .card-number {
    font-family:'Bebas Neue',sans-serif;
    font-size: clamp(.85rem, 1.35vw, 1.5rem);
    color: var(--brand-red); flex-shrink:0; line-height:1;
    animation: numPulse 3s ease-in-out infinite;
  }
  .card-name {
    font-family:'Bebas Neue',sans-serif;
    font-size: clamp(.85rem, 1.35vw, 1.5rem);
    letter-spacing:.04em; color:var(--white);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    flex-shrink:1; min-width:0; line-height:1.1;
  }
  .card-price {
    font-family:'Bebas Neue',sans-serif;
    font-size: clamp(.85rem, 1.35vw, 1.5rem);
    color: var(--brand-yellow); white-space:nowrap; flex-shrink:0;
    text-shadow: 0 0 8px #efa52b55;
  }
  .dot { color:#ffffff25; font-size:.55rem; flex-shrink:0; align-self:center; }
  @keyframes numPulse {
    0%,100% { color:var(--brand-red); text-shadow:none; }
    50%      { color:#e04040; text-shadow: 0 0 8px #c22b2755, 0 0 16px #c22b2730; }
  }

  /* ingredients */
  .card-ingredients {
    font-size: clamp(.52rem, .82vw, .88rem);
    letter-spacing:.04em; text-transform:uppercase;
    color: rgba(255,255,255,.82); line-height:1.4;
    white-space:normal; word-break:break-word;
    max-width: 88%;
    display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;
  }
</style>
</head>

<main id="mainArea"></main>

/* ── FLYING LOGOS ── */
const pc = document.getElementById('pizzaCanvas'), pct = pc.getContext('2d');
let W, H;
function resize() { W = pc.width = window.innerWidth; H = pc.height = window.innerHeight; }
resize(); window.addEventListener('resize', resize);
const logoImg = new Image(); logoImg.src = LOGO;
class FlyingLogo {
  constructor(init) { this.spawn(init); }
  spawn(init) {
    this.size  = 22 + Math.random() * 50;
    this.x     = Math.random() * (W||1400);
    this.y     = init ? Math.random() * (H||900) : (H||900) + this.size;
    this.speed = .14 + Math.random() * .32;
    this.vx    = (Math.random() - .5) * .45;
    this.rot   = Math.random() * Math.PI * 2;
    this.vrot  = (Math.random() - .5) * .010;
    this.alpha = .06 + Math.random() * .12;
    this.life  = 0;
    this.max   = (H||900) / this.speed * 1.4;
  }
  update() {
    this.x += this.vx; this.y -= this.speed; this.rot += this.vrot; this.life++;
    if (this.y < -this.size * 2) this.spawn(false);
  }
  draw(ctx) {
    if (!logoImg.complete) return;
    const p = this.life / this.max;
    const fade = p < .08 ? p/.08 : p > .85 ? 1-(p-.85)/.15 : 1;
    ctx.save(); ctx.globalAlpha = this.alpha * fade;
    ctx.translate(this.x, this.y); ctx.rotate(this.rot);
    ctx.beginPath();
    ctx.arc(0, 0, this.size/2, 0, Math.PI*2);
    ctx.closePath();
    ctx.clip();
    ctx.drawImage(logoImg, -this.size/2, -this.size/2, this.size, this.size);
    ctx.restore();
  }
}
const logos = []; for (let i = 0; i < 20; i++) logos.push(new FlyingLogo(true));
(function loop() { pct.clearRect(0,0,W,H); logos.forEach(l => { l.update(); l.draw(pct); }); requestAnimationFrame(loop); })();

/* ── BUILD ── */
function makeCard(item, idx, totalInSection) {
  const odd = idx % 2 === 0;
  const cls = odd ? 'card-g1' : 'card-g4';
  const delay = (idx * 0.05).toFixed(2);
  const fullWidth = (item.n === 29 || item.n === 34);
  const contentStyle = fullWidth ? ' style="flex:0 0 100%;max-width:100%;z-index:2"' : '';
  const rowStyle = item.n === 34 ? ' style="font-size:clamp(.72rem,1.15vw,1.28rem)"' : '';
  const photoHTML = item.photo ? `<div class="card-photo-wrap"><img class="card-photo" src="${item.photo}" alt="${item.name}" loading="lazy"></div>` : '';
  return `
    <div class="card ${cls}" style="animation-delay:${delay}s">
      <div class="card-inner">
        <div class="card-content"${contentStyle}>
          <div class="card-row"${rowStyle}>
            <span class="card-number">${String(item.n).padStart(2,'0')}</span>
            <span class="dot">·</span>
            <span class="card-name">${item.name}</span>
            <span class="dot">·</span>
            <span class="card-price">${item.price}</span>
          </div>
          ${item.ing ? `<div class="card-ingredients" ${[31,32,33,34].includes(item.n) ? 'style="font-family:\'Bebas Neue\',sans-serif;color:#ffffff;text-shadow:0 0 8px #fff4;font-size:clamp(.85rem,1.35vw,1.5rem);text-transform:none;letter-spacing:.04em;line-height:1.4"' : ''}>${item.ing.replace(/\n/g,'<br>')}</div>` : ''}
        </div>
        ${photoHTML}
      </div>
    </div>`;
}

function makeSection(icon, label, items, rowClass, sectionClass) {
  let cards = items.map((it, i) => makeCard(it, i, items.length)).join('');
  return `
    <div class="section ${sectionClass || ''}">
      <div class="cat-title">
        <div class="cat-inner">
          <span class="cat-item-icon">${icon}</span>
          <span class="cat-item-label">${label}</span>
        </div>
      </div>
      <div class="cards-row ${rowClass}">${cards}</div>
    </div>`;
}
